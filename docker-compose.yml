# Base PostgreSQL de développement : docker compose up -d
# (alternative à l'installation locale de PostgreSQL + database/setup.sh)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datashare
      POSTGRES_USER: datashare
      POSTGRES_PASSWORD: datashare
    ports:
      - "5432:5432"
    volumes:
      - datashare-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashare"]
      interval: 5s
      retries: 10

volumes:
  datashare-db:
