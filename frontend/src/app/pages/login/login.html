<app-gradient-shell>
  <section class="card" aria-labelledby="login-title">
    <h1 id="login-title" class="card__title">Connexion</h1>

    @if (info()) {
      <p class="notice notice--info" role="status">{{ info() }}</p>
    }
    @if (error()) {
      <p class="notice notice--danger" role="alert">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" formControlName="email" autocomplete="email"
               placeholder="Saisissez votre email" [attr.aria-invalid]="invalid('email')"
               aria-describedby="login-email-error" />
        @if (invalid('email')) {
          <span id="login-email-error" class="field__error">Saisis une adresse e-mail valide.</span>
        }
      </div>

      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input id="login-password" type="password" formControlName="password" autocomplete="current-password"
               placeholder="Saisissez votre mot de passe" [attr.aria-invalid]="invalid('password')"
               aria-describedby="login-password-error" />
        @if (invalid('password')) {
          <span id="login-password-error" class="field__error">Saisis ton mot de passe.</span>
        }
      </div>

      <p class="card__alt"><a routerLink="/inscription">Créer un compte</a></p>

      <button type="submit" class="btn btn--soft btn--block" [disabled]="pending()">
        {{ pending() ? 'Connexion…' : 'Connexion' }}
      </button>
    </form>
  </section>
</app-gradient-shell>
