name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: API Spring Boot (tests + couverture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  frontend:
    name: Front Angular (tests + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: Tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datashare
          POSTGRES_USER: datashare
          POSTGRES_PASSWORD: datashare
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U datashare" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Démarrer l'API
        working-directory: backend
        run: |
          mvn -B -q -DskipTests package
          nohup java -jar target/datashare-api-0.1.0.jar > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - name: Démarrer le front
        working-directory: frontend
        run: |
          npm ci
          nohup npx ng serve --port 4200 > ng.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:4200 > /dev/null && break; sleep 2; done
      - name: Lancer Playwright
        working-directory: frontend
        env:
          E2E_CHANNEL: chromium
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-report
          path: frontend/e2e-report
